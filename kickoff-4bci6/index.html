<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#071209">
<title>Striker Spirit (preview)</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root { --red: #e23b3b; --gold: #ffd23f; --ink: #0d1117; --cream: #fff7e6; --ice: #8fd8ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #071209; color: var(--cream);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; display: block; }
  #fx { pointer-events: none; z-index: 9; }
  .bang { font-family: Bangers, Impact, sans-serif; letter-spacing: 1.5px; font-weight: 400; }

  /* HUD */
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 3; pointer-events: none; padding: calc(8px + env(safe-area-inset-top)) 12px 0;
    display: none; flex-direction: column; align-items: center; gap: 5px; }
  #score { background: rgba(10, 14, 20, .8); border-radius: 10px; padding: 4px 14px; font-size: 22px; display: flex; gap: 12px; align-items: center; }
  #score .t { font-size: 14px; opacity: .8; font-family: system-ui; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  #sp { width: min(260px, 70vw); height: 14px; border-radius: 7px; background: rgba(0,0,0,.6); overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,.25); }
  #sp i { position: absolute; inset: 0; width: 50%; background: linear-gradient(90deg, #ff8a00, var(--gold)); transition: width .25s; }
  #sp i.ready { background: linear-gradient(90deg, #ff3c00, #ffd23f, #fff6a8); animation: glow .6s infinite alternate; }
  @keyframes glow { to { filter: brightness(1.35); } }
  #sp b { position: absolute; left: 6px; right: 6px; top: -1px; font-size: 12px; font-family: Bangers, sans-serif; letter-spacing: 1px; color: #fff; text-shadow: 0 1px 2px #000; display: flex; justify-content: space-between; }
  /* selected player: energy (left, draining or recovering) and skills */
  #pl { position: fixed; left: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 4; display: none; align-items: center; gap: 8px; pointer-events: none;
    background: rgba(8, 12, 18, .82); border-radius: 34px 12px 12px 34px; padding: 5px 10px 5px 5px; max-width: 58vw; }
  #plf { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--red); background: #333 center/cover; flex: none; display: flex; align-items: center; justify-content: center; font-family: Bangers, sans-serif; font-size: 22px; }
  #pli { min-width: 0; flex: 1; }
  #pln { display: block; font-family: Bangers, sans-serif; letter-spacing: 1px; font-size: 16px; line-height: 1; }
  #pls { display: block; font-size: 10.5px; opacity: .8; white-space: nowrap; margin: 2px 0 3px; }
  #ple { height: 9px; border-radius: 5px; background: #ffffff22; overflow: hidden; width: 124px; max-width: 100%; }
  #ple i { display: block; height: 100%; width: 100%; background: #6dff8f; transition: width .2s, background .3s; }
  #plr { display: block; font-size: 11px; margin-top: 2px; font-weight: 600; }
  /* action buttons (right thumb) */
  #acts { position: fixed; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 4; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  #acts button { display: none; width: 84px; height: 56px; border-radius: 16px; border: 3px solid #000; font-family: Bangers, sans-serif; font-size: 19px; letter-spacing: 1px; color: #fff;
    background: #26415e; box-shadow: 0 3px 0 #000; line-height: 1; padding: 0; touch-action: none; }
  #acts button small { display: block; font-family: system-ui; font-size: 10.5px; letter-spacing: 0; opacity: .9; margin-top: 3px; font-weight: 600; }
  #acts button.on { display: block; }
  #acts #bShoot { background: #b3102b; width: 92px; height: 64px; font-size: 23px; }
  #acts #bLong { background: #2a5d7a; }
  #acts #bTackle { background: #6b4a12; width: 92px; height: 64px; font-size: 22px; }
  #acts button.far { opacity: .45; }
  #acts button:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
  /* PLAN: stop the clock and decide */
  #bPlan { position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top)); z-index: 5; display: none; font-family: Bangers, sans-serif; font-size: 18px; letter-spacing: 1px;
    border: 3px solid #000; border-radius: 14px; background: #ffd23f; color: #000; padding: 6px 10px; box-shadow: 0 3px 0 #000; }
  #bPlan.on { display: block; }
  #bPlan small { display: block; font-family: system-ui; font-size: 10px; letter-spacing: 0; font-weight: 700; }
  #planbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 7; display: none; width: min(560px, calc(100% - 20px));
    background: rgba(5, 10, 18, .93); border: 2px solid #ffd23f; border-radius: 16px; padding: 10px 12px; text-align: center; }
  #planbar.on { display: block; animation: up .2s ease-out; }
  #planbar h4 { margin: 0; font-size: 18px !important; font-family: Bangers, sans-serif; letter-spacing: 1px; font-size: 22px; color: var(--gold); font-weight: 400; }
  #planbar p { margin: 3px 0 8px; font-size: 13px; color: #cfe; }
  #planbar p b { color: var(--gold); }
  #planacts { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  #planacts button, #planbar .tac button, #planGo { font-family: Bangers, sans-serif; letter-spacing: 1px; font-size: 18px; border: 0; border-radius: 10px; padding: 7px 12px; color: #fff; background: #26415e; box-shadow: 0 3px 0 #000; }
  #planacts button small { display: block; font-family: system-ui; font-size: 10.5px; letter-spacing: 0; opacity: .9; }
  #planacts button.sp { background: linear-gradient(135deg, #b3102b, #ff7a00); }
  #planbar .tac { display: flex; gap: 4px; justify-content: center; align-items: center; font-size: 12px; flex-wrap: wrap; }
  #planbar .tac button { font-size: 15px; padding: 5px 9px; background: #1b2a38; }
  #planbar .tac button.sel { background: #fff; color: #000; }
  #planbar .tac #planGo { background: var(--gold); color: #000; font-size: 19px; padding: 5px 16px; margin-left: 6px; }
  #zone { position: fixed; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 0 4px #ffd23f, inset 0 0 50px rgba(255,210,63,.55); opacity: 0; transition: opacity .4s; }
  #zone.on { opacity: 1; animation: glow .5s infinite alternate; }
  #hint { position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; z-index: 3; pointer-events: none;
    font-size: 15px; text-shadow: 0 1px 3px #000, 0 0 8px #000; padding: 0 16px; transition: opacity .4s; }

  /* story toast (rival taunts, coach) */
  #toast { position: fixed; left: 50%; top: calc(104px + env(safe-area-inset-top)); z-index: 6; transform: translate(-50%, -20px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 10px; background: rgba(8, 12, 18, .92); border: 2px solid #ffffff33; border-radius: 40px 14px 14px 40px; padding: 6px 14px 6px 6px;
    width: max-content; max-width: min(92vw, 420px); transition: transform .25s, opacity .25s; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #toast img { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--ice); object-fit: cover; flex: none; }
  #toast b { display: block; font-family: Bangers, sans-serif; letter-spacing: 1px; font-size: 17px; color: var(--ice); }
  #toast span { font-size: 14px; line-height: 1.3; }

  /* decision scene */
  #scene { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: none; padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(5, 8, 12, .94) 22%); }
  #scene.on { display: block; animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(50px); opacity: 0; } }
  .vs { display: flex; align-items: center; justify-content: center; gap: 10px; max-width: 520px; margin: 0 auto 6px; }
  .vs .f { width: 62px; height: 62px; border-radius: 50%; border: 3px solid var(--red); background: #222 center/cover; flex: none; box-shadow: 0 3px 0 #000; }
  .vs .f.them { border-color: #8aa; }
  .vs .f.gen { display: flex; align-items: center; justify-content: center; font-family: Bangers, sans-serif; font-size: 28px; color: #fff; }
  .vs h3 { margin: 0; font-size: 25px; color: var(--gold); text-shadow: 0 2px 0 #000; text-align: center; line-height: 1; flex: 1; min-width: 0; }
  .vs h3 small { display: block; font-size: 13px; color: #fff; opacity: .8; letter-spacing: .5px; margin-top: 3px; font-family: system-ui; }
  #shint { text-align: center; font-size: 13px; margin: 0 auto 8px; max-width: 520px; color: #bfe6ff; min-height: 1em; }
  #opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 520px; margin: 0 auto; }
  #opts button { position: relative; font: inherit; border: 0; border-radius: 12px; padding: 9px 8px 8px; color: #fff; background: #223040; text-align: left;
    box-shadow: 0 3px 0 #0c1118; overflow: hidden; min-height: 64px; }
  #opts button .n { font-family: Bangers, sans-serif; letter-spacing: 1px; font-size: 21px; line-height: 1; display: block; padding-right: 54px; }
  #opts button .p { position: absolute; right: 8px; top: 6px; font-family: Bangers, sans-serif; font-size: 26px; letter-spacing: 0; }
  #opts button small { display: block; font-size: 11.5px; opacity: .8; margin-top: 3px; line-height: 1.25; padding-right: 4px; }
  #opts button .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: currentColor; }
  #opts button.sp { background: linear-gradient(135deg, #b3102b, #ff7a00); grid-column: 1 / -1; }
  #opts button.sp .n { font-size: 26px; }
  #opts button.sp.pulse { animation: pulse .55s infinite alternate; }
  #opts button.safe { background: #1d3a33; }
  #opts button:disabled { opacity: .35; }
  #opts button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0c1118; }
  .tag { display: inline-block; font-size: 10px; background: #ffd23f; color: #000; border-radius: 4px; padding: 0 4px; margin-left: 4px; font-weight: 700; vertical-align: 2px; }

  #banner { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 8; pointer-events: none; }
  #banner span { font-size: min(20vw, 130px); color: var(--gold); -webkit-text-stroke: 3px #000; text-shadow: 0 6px 0 #000; transform: rotate(-6deg); text-align: center; line-height: .9; }
  #banner span.go { animation: slam .95s cubic-bezier(.2, 1.6, .4, 1) both; }
  #banner span.small { font-size: min(13vw, 80px); }
  @keyframes slam { 0% { transform: scale(3) rotate(-6deg); opacity: 0; } 30% { transform: scale(1) rotate(-6deg); opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1) rotate(-6deg); } }

  /* screens */
  .screen { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px;
    background: radial-gradient(ellipse at 50% 30%, #1c4d2a, #071209 75%); padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); overflow-y: auto; text-align: center; touch-action: pan-y; }
  .screen.on { display: flex; animation: fade .3s; }
  @keyframes fade { from { opacity: 0; } }
  .screen h1 { font-size: min(16vw, 84px); margin: 0; color: var(--gold); -webkit-text-stroke: 2px #000; text-shadow: 0 5px 0 #000; transform: rotate(-4deg); line-height: .9; }
  .screen h2 { font-size: 30px; margin: 0; color: var(--gold); text-shadow: 0 3px 0 #000; }
  .screen p { margin: 0; max-width: 440px; opacity: .92; line-height: 1.4; }
  .btn { font-family: Bangers, sans-serif; letter-spacing: 1.5px; font-size: 26px; border: 0; border-radius: 14px; padding: 12px 34px; color: #000;
    background: var(--gold); box-shadow: 0 4px 0 #8a6a00; cursor: pointer; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a6a00; }
  .btn.alt { background: #2b3a4c; color: #fff; box-shadow: 0 4px 0 #111a24; font-size: 19px; padding: 9px 18px; }
  .link { background: none; border: 0; color: #fff; opacity: .55; text-decoration: underline; font-size: 13px; padding: 6px; }
  .small { font-size: 13px; opacity: .7; }
  .grade { font-family: Bangers, sans-serif; font-size: 96px; line-height: 1; color: #fff; -webkit-text-stroke: 3px #000; text-shadow: 0 5px 0 #000; animation: slamIn .6s cubic-bezier(.2, 1.6, .4, 1) both .5s; }
  .grade.S { color: var(--gold); } .grade.A { color: #ff9b3f; } .grade.B { color: #8fd8ff; }
  @keyframes slamIn { 0% { transform: scale(3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 420px; }
  .chips span { background: #ffffff14; border-radius: 20px; padding: 4px 10px; font-size: 13px; }
  .chips b { color: var(--gold); }
  .xp { width: min(100%, 360px); height: 16px; background: #ffffff22; border-radius: 8px; overflow: hidden; position: relative; }
  .xp i { display: block; height: 100%; background: linear-gradient(90deg, #2fb4ff, #9ff0ff); width: 0; transition: width 1.1s ease-out; }
  .unlock { color: #ff9b3f; font-size: 24px; animation: pulse .7s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.06); } }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: min(100%, 560px); }
  .card { background: #10202e; border: 2px solid #ffffff22; border-radius: 14px; padding: 12px; text-align: left; color: #fff; font: inherit; display: flex; flex-direction: column; gap: 5px; }
  .card h3 { margin: 0; font-family: Bangers, sans-serif; letter-spacing: 1px; font-size: 26px; color: var(--gold); }
  .card .sp { font-family: Bangers, sans-serif; letter-spacing: 1px; color: #ff9b3f; font-size: 18px; }
  .card p { font-size: 13px; opacity: .85; margin: 0; }
  .card .row { display: flex; gap: 6px; margin-top: 4px; }
  .card .row .btn { font-size: 18px; padding: 7px 12px; flex: 1; }
  .card.sel { border-color: var(--gold); }
  .face-big { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--ice); object-fit: cover; box-shadow: 0 5px 0 #000; }
  .bubble { background: #fff; color: #111; border-radius: 16px; padding: 12px 16px; max-width: 400px; font-size: 17px; line-height: 1.4; position: relative; box-shadow: 0 4px 0 #000; text-align: left; min-height: 3em; }
  .bubble b { font-family: Bangers, sans-serif; letter-spacing: 1px; color: #1b6b3a; display: block; font-size: 18px; }
  .rate { display: flex; gap: 8px; }
  .rate button { width: 54px; height: 54px; border-radius: 12px; border: 2px solid #ffffff44; background: #10202e; color: #fff; font-family: Bangers, sans-serif; font-size: 28px; }
  .rate button.sel { background: var(--gold); color: #000; }
  textarea { width: min(100%, 420px); height: 90px; border-radius: 12px; border: 2px solid #ffffff33; background: #0b1620; color: #fff; padding: 10px; font: inherit; font-size: 16px; user-select: text; -webkit-user-select: text; }
  .consent { background: #0b1620; border: 1px solid #ffffff22; border-radius: 12px; padding: 10px 12px; max-width: 420px; font-size: 13px; text-align: left; }
  .consent div { display: flex; gap: 8px; margin-top: 8px; }
  .consent button { flex: 1; font: inherit; font-size: 14px; border-radius: 10px; border: 0; padding: 8px; background: var(--gold); color: #000; font-weight: 700; }
  .consent button.ghost { background: #2b3a4c; color: #fff; }
  .count { font-family: Bangers, sans-serif; font-size: 64px; color: var(--gold); text-shadow: 0 4px 0 #000; }
  #rot { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>
<div id="zone"></div>
<div id="hud">
  <div id="score" class="bang"><span id="sc"></span><span class="t" id="clock"></span></div>
  <div id="sp"><i></i><b><span>SPIRIT</span><span id="spt"></span></b></div>
</div>
<div id="hint"></div>
<div id="pl"><div id="plf"></div><div id="pli"><b id="pln"></b><span id="pls"></span><div id="ple"><i></i></div><span id="plr"></span></div></div>
<div id="acts"><button id="bLong">LONG<small></small></button><button id="bPass">PASS<small></small></button><button id="bShoot">SHOOT<small></small></button><button id="bTackle">TACKLE<small></small></button></div>
<div id="toast"><img alt=""><div><b></b><span></span></div></div>
<div id="scene"><div class="vs"><div class="f" id="fl"></div><h3 class="bang" id="st"></h3><div class="f them" id="fr"></div></div><p id="shint"></p><div id="opts"></div></div>
<div id="banner"></div>
<button id="bPlan">⏸ PLAN<small>stop &amp; decide</small></button>
<div id="planbar"><h4>⏸ PLAN · TIME STOPPED</h4><p id="planhint"></p><div id="planacts"></div>
  <div class="tac">TEAM <button data-t="def">DEFEND</button><button data-t="bal">BALANCED</button><button data-t="att">ATTACK</button><button id="planGo">▶ PLAY</button></div></div>

<div class="screen on" id="title">
  <h1 class="bang">STRIKER<br>SPIRIT</h1>
  <p class="bang" style="font-size:22px;color:#8fd8ff;letter-spacing:1px">FIRST SEASON · PREVIEW</p>
  <img class="face-big" src="img/face_kai.jpg" alt="" style="border-color:var(--red)">
  <button class="btn" id="play">KICK OFF</button>
  <p class="small" id="tsub"></p>
  <div id="consentBox"></div>
  <button class="link" id="reset">start a new season</button>
</div>
<div class="screen" id="result"></div>
<div class="screen" id="pick"></div>
<div class="screen" id="train"></div>
<div class="screen" id="story"></div>
<div class="screen" id="nextm"></div>
<div class="screen" id="feedback"></div>
<div class="screen" id="ending"></div>

<script src="core.js"></script>
<script src="cine.js"></script>
<script src="match.js"></script>
<script src="ai.js"></script>
<script src="plan.js"></script>
<script src="scene.js"></script>
<script src="meta.js"></script>
</body>
</html>
